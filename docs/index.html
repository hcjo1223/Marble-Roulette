<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <title>총총 래그돌 달리기 3D — 3D 장애물 레이스 추첨기</title>
    <meta
      name="description"
      content="Three.js와 Rapier3D 물리 엔진 기반 로블록스풍 3D 래그돌 장애물 경주 랜덤 추첨 게임"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@700;800&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap"
      rel="stylesheet"
    />
    <script type="module" crossorigin src="./assets/index-Ck8Y9s6S.js"></script>
    <link rel="stylesheet" crossorigin href="./assets/index-BD3GIeB7.css">
  </head>
  <body>
    <div id="app">
      <!-- 3D WebGL Viewport -->
      <div id="canvas-container" aria-label="3D Ragdoll Obstacle Race Viewport"></div>

      <!-- Cinema Slow-Motion Letterbox Bars -->
      <div id="letterbox-top" class="letterbox-bar"></div>
      <div id="letterbox-bottom" class="letterbox-bar"></div>

      <!-- Top Center Zone Badge, Timer & Rainbow Progress Bar (IMG_2317 style) -->
      <header id="top-stage-bar">
        <div class="stage-pills-row">
          <button
            type="button"
            class="stage-pill map-switch-pill"
            id="btn-quick-map-toggle"
            title="클릭하여 맵 테마 변경 (운동장 ↔ 태권도)"
          >
            🗺️ 맵1: 🏫 운동장
          </button>
          <div class="stage-pill" id="hud-zone-badge">🏠 교실</div>
          <div class="stage-pill timer-pill" id="hud-timer">0.0초</div>
          <div class="stage-pill rule-pill" id="hud-win-rule">🏆 1등 당첨</div>
        </div>
        <div class="rainbow-progress-wrap" aria-label="코스 진행률">
          <div id="minimap-track" class="rainbow-progress-track">
            <div class="minimap-finish-line"></div>
            <div id="minimap-dots"></div>
          </div>
        </div>
      </header>

      <!-- Top Right Quick Action Pills -->
      <div id="top-right-actions">
        <button id="btn-toggle-setup" class="pill-btn primary-pill" title="참가자 설정 열기/닫기">
          ⚙️ 설정
        </button>
        <button id="btn-toggle-leaderboard" class="pill-btn mobile-only-btn" title="순위표 열기/닫기">
          🏆 순위
        </button>
        <button id="btn-quick-start" class="pill-btn start-pill">
          🏁 시작
        </button>
        <button id="btn-blast-test" class="pill-btn" title="전체 래그돌 충격파">
          💥 <span class="hide-sm">충격파</span>
        </button>
        <button id="btn-bgm-toggle" class="pill-btn muted" title="배경음악 켜기/끄기">
          🎵
        </button>
        <button id="btn-sound-toggle" class="pill-btn" title="효과음 켜기/끄기">
          🔊
        </button>
      </div>

      <!-- Left Crisp Pill Leaderboard (IMG_2317 style) -->
      <aside id="leaderboard-panel" class="mobile-collapsed">
        <div class="leaderboard-header-mobile mobile-only-flex">
          <span>🏆 실시간 순위 (터치 시 추적)</span>
          <button id="btn-close-leaderboard" class="panel-close-btn" aria-label="순위표 닫기">
            ✕
          </button>
        </div>
        <div id="leaderboard-list" class="pill-leaderboard-list" role="list"></div>
        <div class="leaderboard-tip">이름을 누르면 그 친구를 따라가요</div>
      </aside>

      <!-- Setup Modal / Drawer -->
      <aside id="setup-panel" class="light-card-panel">
        <div class="panel-header">
          <h2>🏃 참가자 및 내기 설정</h2>
          <div class="panel-header-actions">
            <span id="parsed-count-badge" class="count-badge">16명 준비됨</span>
            <button id="btn-close-setup" class="panel-close-btn" aria-label="설정 닫기">
              ✕
            </button>
          </div>
        </div>

        <div class="form-section">
          <span class="field-label">🗺️ 경주 맵 테마 선택</span>
          <div class="map-selector" role="radiogroup" aria-label="경주 맵 선택">
            <button type="button" class="map-btn active" data-map="PLAYGROUND">
              🏫 맵1: 운동장 경주
            </button>
            <button type="button" class="map-btn" data-map="TAEKWONDO">
              🥋 맵2: 태권도 경주
            </button>
          </div>
        </div>

        <div class="form-section">
          <label for="participants-input" class="field-label">
            참가자 이름 <small>(쉼표/줄바꿈, <code>이름*수량</code> 가능)</small>
          </label>
          <textarea
            id="participants-input"
            rows="4"
            placeholder="예: 1번, 2번, 3번... 또는 김철수*2, 이영희"
            spellcheck="false"
          >1번, 2번, 3번, 4번, 5번, 6번, 7번, 8번, 9번, 10번, 11번, 12번, 13번, 14번, 15번, 16번</textarea>

          <div class="preset-row">
            <button type="button" class="preset-btn" data-preset="class20">🏫 우리반 20번</button>
            <button type="button" class="preset-btn" data-preset="coffee">☕ 커피내기 10인</button>
            <button type="button" class="preset-btn" data-preset="weighted">🎲 가중치(이름*N)</button>
            <button type="button" class="preset-btn" data-preset="mass">🔥 대규모 28번</button>
          </div>
        </div>

        <div class="form-section">
          <span class="field-label">당첨자 결정 방식</span>
          <div class="rule-selector" role="radiogroup" aria-label="당첨 기준 선택">
            <button type="button" class="rule-btn active" data-rule="FIRST">🏆 1등 당첨</button>
            <button type="button" class="rule-btn" data-rule="LAST">💀 꼴찌 당첨</button>
            <button type="button" class="rule-btn" data-rule="NTH">🎯 N등 지정</button>
          </div>

          <div id="nth-rank-row" class="nth-row hidden">
            <label for="nth-rank-input">목표 당첨 순위 (등수):</label>
            <input id="nth-rank-input" type="number" min="1" max="50" value="3" />
          </div>
        </div>

        <div class="action-stack">
          <button id="btn-start-race" class="primary-cta-btn">
            🏁 레이스 출발! (START)
          </button>
          <button id="btn-shuffle-racers" class="secondary-btn">
            🔀 자리 섞기 / 리셋
          </button>
        </div>
      </aside>

      <!-- Center Countdown & Slow-Motion Broadcast Banners -->
      <div id="countdown-overlay" class="countdown-overlay hidden" aria-live="polite">
        <span id="countdown-text">3</span>
      </div>

      <div id="slowmo-banner" class="slowmo-banner hidden">
        <span class="slowmo-dot"></span>
        <span>🎬 SLOW MOTION · 결승선 클라이맥스 (0.22x)</span>
      </div>

      <!-- Bottom Camera & Slow-Motion Dock -->
      <nav id="camera-dock" aria-label="관전 카메라 제어">
        <button type="button" class="cam-pill active" data-cam="LEAD" id="cam-btn-lead">
          🎥 선두
        </button>
        <button type="button" class="cam-pill" data-cam="LAST" id="cam-btn-last">
          🐢 꼴찌
        </button>
        <button type="button" class="cam-pill" data-cam="TOP" id="cam-btn-top">
          🗺️ 탑뷰
        </button>
        <button type="button" class="cam-pill" data-cam="FREE" id="cam-btn-free">
          🕹️ 포커스
        </button>
        <button type="button" id="btn-slowmo-toggle" class="cam-pill slowmo-pill">
          ⏱️ 슬로우
        </button>
      </nav>

      <!-- Winner Celebration & Podium Modal -->
      <div id="winner-modal" class="modal-backdrop hidden" role="dialog" aria-modal="true">
        <div class="modal-card light-card-panel">
          <div class="modal-badge" id="modal-rule-badge">🏆 최종 당첨자 발표</div>
          <h2 id="modal-winner-name" class="winner-title">16번</h2>
          <p id="modal-winner-desc" class="winner-subtitle">
            치열한 장애물과 래그돌 몸싸움을 뚫고 당첨되었습니다!
          </p>

          <div class="winner-stats-grid">
            <div class="winner-stat-box">
              <span class="w-label">최종 순위</span>
              <strong id="modal-winner-rank">#1위</strong>
            </div>
            <div class="winner-stat-box">
              <span class="w-label">완주 기록</span>
              <strong id="modal-winner-time">14.2초</strong>
            </div>
            <div class="winner-stat-box">
              <span class="w-label">래그돌 피격</span>
              <strong id="modal-winner-ragdolls">💥 4회</strong>
            </div>
          </div>

          <div class="modal-rankings-wrap">
            <h3>전체 완주 순위</h3>
            <div id="modal-rankings-list" class="modal-rankings-list"></div>
          </div>

          <div class="modal-actions">
            <button id="btn-modal-rematch" class="primary-cta-btn">
              🔄 같은 멤버로 즉시 재경기
            </button>
            <button id="btn-modal-close" class="secondary-btn">
              닫고 관전 계속하기
            </button>
          </div>
        </div>
      </div>
    </div>

  </body>
</html>
